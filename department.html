<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrievEase - Department Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f6f8;
        }

        h1 {
            text-align: center;
        }

        #complaints {
            max-width: 1000px;
            margin: 20px auto;
        }

        .complaint {
            background: white;
            padding: 20px;
            margin-bottom: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .complaint h2 {
            margin-top: 0;
        }

        .status {
            font-weight: bold;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .refresh {
            display: block;
            margin: 20px auto;
        }
    </style>
</head>

<body>

    <h1>GrievEase Department Dashboard</h1>

    <button class="refresh" onclick="loadComplaints()">
        Refresh Complaints
    </button>

    <div id="complaints">
        Loading complaints...
    </div>

    <script>
        async function loadComplaints() {
            try {
                const response = await fetch(
                    "http://localhost:5000/complaints"
                );

                const complaints = await response.json();

                const container = document.getElementById("complaints");

                if (complaints.length === 0) {
                    container.innerHTML = "<p>No complaints received yet.</p>";
                    return;
                }

                container.innerHTML = "";

                complaints.forEach(complaint => {

                    const div = document.createElement("div");
                    div.className = "complaint";

                    div.innerHTML = `
                        <h2>Complaint #${complaint.id}</h2>

                        <p><strong>Name:</strong>
                        ${complaint.name || "Not provided"}</p>

                        <p><strong>Category:</strong>
                        ${complaint.category || "Not provided"}</p>

                        <p><strong>Description:</strong>
                        ${complaint.description || "Not provided"}</p>

                        <p class="status">
                        Status: ${complaint.status}
                        </p>
                    `;

                    container.appendChild(div);
                });

            } catch (error) {
                document.getElementById("complaints").innerHTML =
                    "<p>Unable to connect to the GrievEase server.</p>";

                console.error(error);
            }
        }

        loadComplaints();
    </script>

</body>
</html>
<script>
async function loadDepartmentComplaints() {
    try {
        const response = await fetch("http://localhost:5000/complaints");
        const complaints = await response.json();

        const departments = {
            "Public Works Department": [],
            "Electrical Department": [],
            "Water Supply Department": [],
            "Sanitation Department": [],
            "Drainage Department": [],
            "Parks and Gardens Department": [],
            "General Department": []
        };

        complaints.forEach(complaint => {
            const department = complaint.department || "General Department";

            if (departments[department]) {
                departments[department].push(complaint);
            } else {
                departments["General Department"].push(complaint);
            }
        });

        let output = "";

        for (const department in departments) {
            output += `
                <div class="department-section">
                    <h2>${department}</h2>
            `;

            if (departments[department].length === 0) {
                output += "<p>No complaints received.</p>";
            } else {
                departments[department].forEach(complaint => {
                    output += `
                        <div class="complaint">
                            <h3>Complaint #${complaint.id}</h3>
                            <p><strong>Category:</strong> ${complaint.category || "Not provided"}</p>
                            <p><strong>Description:</strong> ${complaint.description || "Not provided"}</p>
                            <p><strong>Status:</strong> ${complaint.status || "Pending"}</p>
                        </div>
                    `;
                });
            }

            output += "</div>";
        }

        document.body.innerHTML += output;

    } catch (error) {
        console.error("Error loading complaints:", error);
    }
}

loadDepartmentComplaints();
</script>
